services:
  db:
    image: postgres:16
    container_name: ommis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ommis_dev
    ports: ["5432:5432"]
    volumes:
      - ommis_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  ommis_pg: {}
